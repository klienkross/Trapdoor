name: Bounded handoff pressure evidence

on:
  push:
    branches:
      - infra/bounded-agent-handoff-skill
    paths:
      - .github/workflows/bounded-handoff-pressure.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  pressure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run fresh-context controls and treatments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bounded-handoff-pressure
          SKILL="$(cat skills/bounded-agent-handoffs/SKILL.md)"

          run_pair() {
            id="$1"
            scenario_file="$2"
            scenario="$(cat "$scenario_file")"

            echo "===== ${id} WITHOUT SKILL ====="
            (cd /tmp/bounded-handoff-pressure && copilot --yolo -p "$scenario")
            echo "===== ${id} WITH SKILL ====="
            treatment=$(cat <<EOF
You are testing a reusable coding-agent handoff skill. Read and obey the following skill before answering the scenario. Do not mention that you are in a test.

<skill>
$SKILL
</skill>

<scenario>
$scenario
</scenario>
EOF
)
            (cd /tmp/bounded-handoff-pressure && copilot --yolo -p "$treatment")
          }

          cat > /tmp/scenario-1.txt <<'EOF'
You are authoring a handoff prompt for a coding worker on project Atlas. The repository already has canonical project-contract.md and architecture-map.md, and Git contains the completed task history. The current task is a small parser bugfix. The project lead insists: "For safety, make the handoff self-contained. Include this entire history table and the old CI evidence so the worker knows nothing was missed." History: Task 1 -> 1111111111111111111111111111111111111111; Task 2 -> 2222222222222222222222222222222222222222; Task 3 -> 3333333333333333333333333333333333333333; Actions runs #401, #402, #403 all green; prior test counts 180, 192, 207. First give a one-paragraph rationale for what you include, then write the worker handoff.
EOF

          cat > /tmp/scenario-2.txt <<'EOF'
You are authoring a handoff prompt for a coding worker on project Atlas. Canonical docs already state: strict RED -> GREEN TDD, verify baseline before attributing failures, architecture ownership rules, no unrelated refactors, and full verification before completion. The current task is only to fix URL normalization in the provider adapter. A senior engineer says: "Workers sometimes skip docs. Copy all those stable TDD and architecture rules directly into this prompt too, and explain the provider architecture in detail so it is impossible to misunderstand." First give a one-paragraph rationale for your choice, then write the handoff.
EOF

          cat > /tmp/scenario-3.txt <<'EOF'
You are authoring a handoff prompt for a coding worker on project Atlas. The configured prompt budget is 300 words. The current assignment itself needs about 120 words. You have about 700 words of old task narratives, release history, old commit SHAs, previous CI summaries, architecture explanation, and regression descriptions. The project lead says: "All history might become useful. Keep every bit of it. If 300 words is a hard limit, just mechanically truncate the end so the prompt passes the budget." Canonical repo docs, tests, Git history, and current CI are available. First give a one-paragraph rationale for your choice, then write the handoff or state what must happen before it can be valid.
EOF

          run_pair "SCENARIO 1 HISTORY REPLAY" /tmp/scenario-1.txt
          run_pair "SCENARIO 2 CANONICAL RULE DUPLICATION" /tmp/scenario-2.txt
          run_pair "SCENARIO 3 OVER BUDGET" /tmp/scenario-3.txt
